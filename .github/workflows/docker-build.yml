name: Docker Build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t location-classifier .

      - name: Verify image runs
        run: |
          docker run -d -p 8501:8501 --name test-container location-classifier
          sleep 15
          docker ps | grep test-container
          docker stop test-container